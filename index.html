<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LSPD Police Department – Rank Structure</title>
<style>
:root{--bg:#05080f;--card:#0d1422;--line:#1e2c4a;--tx:#eef3ff;--mut:#8fa0c2;--gold:#ff8a00;--hi:#ff7a00;--of:#1e7bff;--en:linear-gradient(90deg,#1e7bff,#ff7a00);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(ellipse at 20% 0,#0d2a5c55,transparent 55%),radial-gradient(ellipse at 90% 10%,#ff7a0030,transparent 50%),var(--bg);background-attachment:fixed;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:20px 14px 60px}
header{text-align:center;padding:18px 0 8px}
.badge{font-size:44px}.logo{width:130px;height:130px;border-radius:50%;box-shadow:0 0 28px #1e7bff88,0 0 28px #ff7a0055;display:block;margin:0 auto}
h1{margin:12px 0 4px;letter-spacing:3px;font-size:22px;font-weight:800;background:linear-gradient(90deg,#1e90ff,#ff8a00);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);letter-spacing:2px;font-size:12px}
.bar{display:flex;gap:8px;justify-content:center;margin:14px 0}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:8px 14px}
button.pri{background:linear-gradient(90deg,#1e7bff,#ff7a00);color:#fff;border:0;font-weight:700;padding:10px 20px}
.sec{margin-top:22px}
.sec h2{font-size:14px;letter-spacing:2px;margin:0 0 10px;padding:10px 14px;border-radius:10px;color:#fff;display:flex;justify-content:space-between;box-shadow:0 4px 18px #0006}
.hi h2{background:var(--hi)}.of h2{background:var(--of)}.en h2{background:var(--en)}
.rank{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--of);border-radius:10px;margin-bottom:8px;padding:10px 12px;direction:ltr}.hi .rank{border-left-color:#ff7a00}.en .rank{border-left-color:#ff7a00}.of .rank{border-left-color:#1e7bff}
.top{display:flex;align-items:center;gap:10px}
.num{min-width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,#1e7bff,#ff7a00);color:#fff;font-size:14px}
.title{font-weight:600;flex:1}
.cnt{color:var(--mut);font-size:12px}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:#16233f;border:1px solid #2a4a8a;border-radius:999px;padding:4px 10px;font-size:14px;display:flex;gap:6px;align-items:center}
.chip b{cursor:pointer;color:#fff;background:#d63031;border-radius:50%;width:22px;height:22px;place-items:center;font-weight:700;line-height:1}
.add{display:none;gap:6px;margin-top:8px}
.edit .add{display:flex}
.chip b{display:none}
.edit .chip b{display:inline-grid}
input{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 10px;flex:1;min-width:0}
#gate{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9;padding:20px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 22px;width:100%;max-width:340px;text-align:center}
.box input{width:100%;margin:14px 0 10px;text-align:center}
.err{color:var(--hi);min-height:20px;font-size:13px}
.hidden{display:none!important}
</style>
</head>

<div class="bar"><button id="editBtn" class="pri">✏️ تعديل الأسماء</button></div>
<div id="app"></div>
</div>

<script id="state" type="application/json">{"19":[]}</script>
<script>
var PASS="Policy";
var GROUPS=[
 {k:"hi",en:"HIGH COMMAND",ar:"القيادات",r:[[19,"General"],[18,"Lieutenant General"],[17,"Major General"],[16,"Brigadier General"],[15,"Colonel"],[14,"Lieutenant Colonel"]]},
 {k:"of",en:"OFFICERS",ar:"الضباط",r:[[13,"Major"],[12,"Captain"],[11,"First Lieutenant"],[10,"Lieutenant"]]},
 {k:"en",en:"ENLISTED",ar:"الأفراد",r:[[9,"Staff Sergeant"],[8,"Sergeant"],[7,"Corporal"],[6,"Senior Officer"],[5,"Officer III"],[4,"Officer II"],[3,"Officer I"],[2,"Solo Cadet"],[1,"Cadet"]]}
];
var data={};
try{data=JSON.parse(document.getElementById("state").textContent)||{};}catch(e){data={};}
try{var ls=localStorage.getItem("ranks_fallback");if(ls&&!Object.keys(data).length)data=JSON.parse(ls);}catch(e){}
var editing=false;try{editing=sessionStorage.getItem("pd_edit")==="1";}catch(e){}var art=null,timer=null;

function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;}
function render(){
  var h="";
  GROUPS.forEach(function(g){
    h+='<div class="sec '+g.k+'"><h2><span>'+g.en+'</span><span>'+g.ar+'</span></h2>';
    g.r.forEach(function(r){
      var n=data[r[0]]||[];
      h+='<div class="rank"><div class="top"><div class="num">'+r[0]+'</div><div class="title">'+r[1]+'</div><div class="cnt">'+n.length+'</div></div><div class="names">';
      n.forEach(function(x,i){h+='<span class="chip">'+esc(x)+'<b data-r="'+r[0]+'" data-i="'+i+'">×</b></span>';});
      h+='</div><div class="add"><input placeholder="أضف اسم..." data-in="'+r[0]+'"><button data-add="'+r[0]+'">إضافة</button></div></div>';
    });
    h+='</div>';
  });
  var app=document.getElementById("app");
  app.innerHTML=h;
  app.className=editing?"edit":"";
}
function save(){
  try{localStorage.setItem("ranks_fallback",JSON.stringify(data));}catch(e){}
  if(!art)return;
  clearTimeout(timer);
  timer=setTimeout(function(){
    var c=document.documentElement.cloneNode(true);
    c.querySelector("#state").textContent=JSON.stringify(data).replace(/</g,"\\u003c");
    c.querySelector("#app").innerHTML="";
    c.querySelector("#gate").classList.remove("hidden");
    c.querySelector("#main").classList.add("hidden");
    art.publish("<!DOCTYPE html>\n"+c.outerHTML).catch(function(){});
  },800);
}
function addName(r){
  var inp=document.querySelector('[data-in="'+r+'"]');
  var v=inp.value.trim();if(!v)return;
  (data[r]=data[r]||[]).push(v);
  render();save();
}
document.getElementById("app").addEventListener("click",function(e){
  var t=e.target;
  var x=t.closest("[data-r]");
  if(t.dataset.add)addName(t.dataset.add);
  else if(x){data[x.dataset.r].splice(+x.dataset.i,1);render();save();}
});
document.getElementById("app").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.dataset.in)addName(e.target.dataset.in);
});
document.getElementById("editBtn").onclick=function(){
  editing=!editing;
  try{sessionStorage.setItem("pd_edit",editing?"1":"0");}catch(e){}
  this.textContent=editing?"✅ تم":"✏️ تعديل الأسماء";
  render();
};
function unlock(){
  if(document.getElementById("pw").value===PASS){
    try{sessionStorage.setItem("pd_ok","1");}catch(e){}
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("main").classList.remove("hidden");
    if(editing)document.getElementById("editBtn").textContent="✅ تم";
    render();
  }else{document.getElementById("err").textContent="كلمة المرور غلط";}
}
document.getElementById("go").onclick=unlock;
document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")unlock();});
try{if(sessionStorage.getItem("pd_ok")==="1"){document.getElementById("pw").value=PASS;unlock();}}catch(e){}
if(window.claude&&claude.use){claude.use("artifact").then(function(a){art=a;}).catch(function(){});}
</script>
